# DQN 训练实验配置 (半庄, 4 个 DQN self-play)
# 用法: python scripts/train.py --config configs/experiment/dqn_hanchan.yaml

experiment:
  name: "dqn_hanchan"
  seed: 42
  total_episodes: 500
  checkpoint_freq: 50
  log_dir: "runs"

game:
  num_players: 4
  initial_score: 25000

ruleset:
  use_red_fives: true
  allow_kuitan: false
  game_length: "hanchan"
  tobi_rule: "any"

state_encoder_config:
  max_actions: 100
  action_feature_dim: 128

render: false

algo: "dqn"
algo_config:
  device: "cuda" # auto/cpu/cuda
  hidden_dim: 256
  learning_rate: 0.0001
  gamma: 0.99
  buffer_size: 100000
  batch_size: 128
  target_update_freq: 500
  epsilon_start: 0.1      # BC 微调用低探索起点 (避免随机动作冲掉预训练策略)
  epsilon_end: 0.05
  epsilon_decay_steps: 50000

agents: # 4 个 DQN self-play
  - "dqn"
  - "dqn"
  - "dqn"
  - "dqn"

reward:
  mode: "placement"
  placement_rewards: [1.0, 0.3, -0.3, -1.0]   # 半庄结束按点数排名, 零和
  step_penalty: 0.0
